[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-briefing"
version = "0.1.0"
description = "Daily HTML email briefing — calendar, email, Etsy orders, Claude usage, and news."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TJ Schmitz" }]
dependencies = [
    "google-api-python-client>=2.140",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    # Windows + minimal Linux images lack the IANA tz database; bundle it.
    "tzdata>=2024.1",
    # OpenAI-compatible client for the local LiteLLM proxy.
    "openai>=1.50",
    # RSS / Atom parsing for the news digest.
    "feedparser>=6.0",
    # Decodes news.google.com redirect URLs to real article URLs via Google's
    # batchexecute endpoint (two HTTP calls per URL, no headless browser needed).
    "googlenewsdecoder>=0.1.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[project.scripts]
daily-briefing = "briefing.run:main"

[tool.setuptools.packages.find]
include = ["briefing*"]

[tool.setuptools.package-data]
briefing = ["templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
